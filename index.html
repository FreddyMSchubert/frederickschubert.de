	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="window">

		</div>

			<div>
				<span class="prompt">guest@frederickschubert.com:~$ </span>
				<span id="input"></span>
			</div>
		</div>
	</div>

	<script src="input.js"></script>
</body>
</html>
